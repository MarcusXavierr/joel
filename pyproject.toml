[project]
name = "joel"
version = "0.0.1"
description = "Your spoken English, every grammar mistake, the exact second you made it."
readme = "README.md"
authors = [
    { name = "Marcus Xavier", email = "marcusxavierr123@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "en-core-web-sm",
    "errant>=3.0.2",
    "genai-prices>=0.2.3",
    "httpx>=0.28.1",
    "huggingface-hub>=1.18.0",
    "packaging>=25.0",
    "pydantic>=2.12",
    "pydantic-ai-slim[anthropic,bedrock,cohere,google,groq,huggingface,mistral,openai,openrouter,xai]>=2.68.0",
    "spacy>=3.8.18",
    "transcribe-cpp>=0.4.2",
]

[project.scripts]
joel = "joel.cli:main"

[project.optional-dependencies]
elevenlabs = [
    "elevenlabs>=2.78.0",
]
openai = [
    "openai>=3.50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not slow"]
markers = ["slow: loads a model or needs ffmpeg; excluded from the default run"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Keeps the espeak-ng command in its comment on one copyable line.
"tests/test_parakeet.py" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
